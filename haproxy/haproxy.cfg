global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:8080
    default_backend nginx_backend

backend nginx_backend
    balance roundrobin
    server nginx-service custom-nginx.cse644.svc.cluster.local:80 check